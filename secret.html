<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One More Thing 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
  margin: 0;
  background: #000;
  color: #ffcc66;
  font-family: 'Patrick Hand', cursive;
  overflow-x: hidden;
  animation: pageFade 1.2s ease;
}

@keyframes pageFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== HANGING PHOTOS ===== */
.hanging-photos {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.photo {
  position: absolute;
  width: 150px;
  padding: 6px;
  background: rgba(20,20,20,0.95);
  border-radius: 12px;

  /* 👇 KEY FIXES */
  opacity: 0;                  /* start hidden */
  filter: blur(1px);           /* safe blur */
  box-shadow: 0 20px 45px rgba(0,0,0,0.95);

  animation:
    photoIn 1.6s ease forwards,
    sway 7s ease-in-out infinite alternate,
    float 12s ease-in-out infinite;
}

/* entrance */
@keyframes photoIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to   { opacity: 0.55; transform: translateY(0) scale(1); }
}

/* hanging sway */
@keyframes sway {
  from { transform: rotate(-2deg); }
  to   { transform: rotate(2deg); }
}

/* subtle floating */
@keyframes float {
  0%   { margin-top: 0; }
  50%  { margin-top: -8px; }
  100% { margin-top: 0; }
}

/* string */
.photo::before {
  content: "";
  position: absolute;
  top: -45px;
  left: 50%;
  width: 2px;
  height: 45px;
  background: rgba(255,255,255,0.65);
}

/* sharpen at end */
.photo.focus {
  filter: blur(0);
  opacity: 0.75;
  transition: filter 1.4s ease, opacity 1.4s ease;
}

/* ===== CONTENT ===== */
.container {
  position: relative;
  z-index: 3;
  max-width: 800px;
  margin: auto;
  padding: 80px 30px;
}

h1 {
  text-align: center;
  font-size: 48px;
  margin-bottom: 50px;
}

#letter {
  font-size: 22px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 22px;
  background: #ffcc66;
  animation: blink 1s infinite;
  margin-left: 4px;
}

@keyframes blink {
  0%,50% { opacity: 1; }
  51%,100% { opacity: 0; }
}

/* glow */
.last-glow {
  animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 6px rgba(255,150,120,.4); }
  to   { text-shadow: 0 0 14px rgba(255,150,120,.9); }
}

/* buttons */
.buttons {
  margin-top: 50px;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  transition: all .8s ease;
}

button {
  padding: 14px 34px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  margin: 12px;
  cursor: pointer;
  font-family: inherit;
  background: #ffb703;
  color: #2a1600;
}

.no {
  background: #444;
  color: #eee;
}

/* hearts */
.heart {
  position: fixed;
  font-size: 22px;
  animation: floatUp 3s linear forwards;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to   { transform: translateY(-150px); opacity: 0; }
}

/* mobile */
@media (max-width: 600px) {
  h1 { font-size: 36px; }
  #letter { font-size: 20px; }
}
</style>
</head>

<body>

<!-- 🎶 MUSIC -->
<audio id="bgMusic" src="assets/romantic.mp3" loop></audio>

<!-- 🖼️ PHOTOS -->
<div class="hanging-photos">
  <img src="assets/photos/a1.jpg" class="photo" style="top:8%; left:6%;">
  <img src="assets/photos/a2.jpg" class="photo" style="top:14%; right:8%;">
  <img src="assets/photos/a3.jpg" class="photo" style="bottom:22%; left:10%;">
  <img src="assets/photos/a4.jpg" class="photo" style="bottom:18%; right:12%;">
  <img src="assets/photos/a5.jpg" class="photo" style="top:42%; left:44%;">
</div>

<div class="container">
  <h1>Hey Aleena…</h1>
  <div id="letter"></div><span class="cursor" id="cursor"></span>

  <div class="buttons" id="buttons">
    <button onclick="yes()">Yes 💖</button>
    <button class="no" onclick="no()">No 🙈</button>
  </div>
</div>

<script>
/* 🎶 music continuity */
const music = document.getElementById("bgMusic");
function startMusic(){
  const t = sessionStorage.getItem("musicTime");
  const v = sessionStorage.getItem("musicVolume");
  if(t) music.currentTime = parseFloat(t);
  music.volume = v ? parseFloat(v) : 0.3;
  music.play().catch(()=>{});
}
document.addEventListener("click", startMusic, {once:true});
document.addEventListener("touchstart", startMusic, {once:true});

setInterval(()=>{
  if(!music.paused){
    sessionStorage.setItem("musicTime", music.currentTime);
    sessionStorage.setItem("musicVolume", music.volume);
  }
},400);

/* 💌 text */
const text = `
I don’t really know how to explain this properly,
so I decided to just be honest instead.

Somewhere between small conversations,
random smiles,
and quiet moments,
you became someone I care about more than I expected.

This whole thing —
the pages, the little details,
even the silly animations —
they’re all here for one reason.

You.

I wanted you to feel special.
I wanted you to feel chosen.
And I wanted you to know that
there’s someone who genuinely thinks about you.

So here I am,
with a soft heart and a simple question,
hoping you feel even half of what I feel right now.

I’d really love to choose you 💕
`;

const letter = document.getElementById("letter");
const cursor = document.getElementById("cursor");
const buttons = document.getElementById("buttons");

let i=0;
const TYPE_SPEED = 240; // ⚡ FAST

const typing = setInterval(()=>{
  letter.innerHTML += text.charAt(i++);
  if(i >= text.length){
    clearInterval(typing);
    cursor.remove();

    letter.innerHTML = letter.innerHTML.replace(
      "I’d really love to choose you 💕",
      `<span class="last-glow">I’d really love to choose you 💕</span>`
    );

    document.querySelectorAll(".photo").forEach(p=>p.classList.add("focus"));

    buttons.style.opacity=1;
    buttons.style.transform="translateY(0)";
  }
}, TYPE_SPEED);

/* YES */
function yes(){
  for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="💕";
    h.style.left=Math.random()*100+"vw";
    h.style.bottom="0";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
  setTimeout(()=>{
    location.href="https://wa.me/919746104873?text="+
    encodeURIComponent("I saw your surprise… and my answer is YES 💖🥹");
  },1200);
}

/* NO */
let n=0;
const noTexts=["Are you sure? 🥺","Read again 😌","That button is shy 🙈","I’ll wait 💕"];
function no(){ alert(noTexts[n++%noTexts.length]); }
</script>

</body>
</html>
