<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One More Thing 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
  margin: 0;
  background: radial-gradient(circle at top, #0b0b12, #000);
  color: #ffcc66;
  font-family: 'Patrick Hand', cursive;
  overflow-x: hidden;
  animation: pageFade 1.2s ease;
}

/* Page fade */
@keyframes pageFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Floating glow particles */
.particle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: rgba(255,200,150,0.8);
  border-radius: 50%;
  animation: floatUp 8s linear infinite;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 1; }
}

/* ===== CONTENT ===== */
.container {
  max-width: 800px;
  margin: auto;
  padding: 80px 30px;
  animation: rise 1.2s ease;
}

@keyframes rise {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

h1 {
  text-align: center;
  font-size: 48px;
  margin-bottom: 50px;
}

/* Letter */
#letter {
  font-size: 22px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 22px;
  background: #ffcc66;
  animation: blink 1s infinite;
  margin-left: 4px;
}

@keyframes blink {
  0%,50% { opacity: 1; }
  51%,100% { opacity: 0; }
}

/* Glow last line */
.last-glow {
  animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 6px rgba(255,150,120,.4); }
  to   { text-shadow: 0 0 14px rgba(255,150,120,.9); }
}

/* Buttons */
.buttons {
  margin-top: 50px;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  transition: all .8s ease;
}

button {
  padding: 14px 34px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  margin: 12px;
  cursor: pointer;
  font-family: inherit;
  background: #ffb703;
  color: #2a1600;
}

.no {
  background: #444;
  color: #eee;
}

/* Hearts */
.heart {
  position: fixed;
  font-size: 22px;
  animation: floatHeart 3s linear forwards;
  pointer-events: none;
}

@keyframes floatHeart {
  from { transform: translateY(0); opacity: 1; }
  to   { transform: translateY(-160px); opacity: 0; }
}

/* Mobile */
@media (max-width: 600px) {
  h1 { font-size: 36px; }
  #letter { font-size: 20px; }
}
</style>
</head>

<body>

<!-- 🎶 Music -->
<audio id="bgMusic" src="assets/romantic.mp3" loop></audio>

<!-- ✨ Floating particles -->
<script>
for (let i = 0; i < 20; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 8 + "s";
  document.body.appendChild(p);
}
</script>

<div class="container">
  <h1>Hey Aleena…</h1>

  <div id="letter"></div><span class="cursor" id="cursor"></span>

  <div class="buttons" id="buttons">
    <button onclick="yes()">Yes 💖</button>
    <button class="no" onclick="no()">No 🙈</button>
  </div>
</div>

<script>
/* 🎶 Continuous music */
const music = document.getElementById("bgMusic");

function startMusic() {
  const t = sessionStorage.getItem("musicTime");
  const v = sessionStorage.getItem("musicVolume");
  if (t) music.currentTime = parseFloat(t);
  music.volume = v ? parseFloat(v) : 0.3;
  music.play().catch(()=>{});
}
document.addEventListener("click", startMusic, { once:true });
document.addEventListener("touchstart", startMusic, { once:true });

setInterval(() => {
  if (!music.paused) {
    sessionStorage.setItem("musicTime", music.currentTime);
    sessionStorage.setItem("musicVolume", music.volume);
  }
}, 400);

/* 💌 Text */
const text = `
I don’t really know how to explain this properly,
so I decided to just be honest instead.

Somewhere between small conversations,
random smiles,
and quiet moments,
you became someone I care about more than I expected.

This whole thing —
the pages, the little details,
even the silly animations —
they’re all here for one reason.

You.

I wanted you to feel special.
I wanted you to feel chosen.
And I wanted you to know that
there’s someone who genuinely thinks about you.

So here I am,
with a soft heart and a simple question,
hoping you feel even half of what I feel right now.

I’d really love to choose you 💕
`;

const letter = document.getElementById("letter");
const cursor = document.getElementById("cursor");
const buttons = document.getElementById("buttons");

let i = 0;
const TYPE_SPEED = 140; // ⚡ fast

const typing = setInterval(() => {
  letter.innerHTML += text.charAt(i++);
  if (i >= text.length) {
    clearInterval(typing);
    cursor.remove();

    letter.innerHTML = letter.innerHTML.replace(
      "I’d really love to choose you 💕",
      `<span class="last-glow">I’d really love to choose you 💕</span>`
    );

    buttons.style.opacity = 1;
    buttons.style.transform = "translateY(0)";
  }
}, TYPE_SPEED);

/* YES */
function yes() {
  for (let i = 0; i < 30; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "💕";
    h.style.left = Math.random() * 100 + "vw";
    h.style.bottom = "0";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
  }

  fadeMusic(0, 1200);

  setTimeout(() => {
    location.href =
      "https://wa.me/919876543210?text=" +
      encodeURIComponent("I saw your surprise… and my answer is YES 💖🥹");
  }, 1300);
}

/* NO */
let n = 0;
const noTexts = ["Are you sure? 🥺","Read again 😌","That button is shy 🙈","I’ll wait 💕"];
function no(){ alert(noTexts[n++ % noTexts.length]); }

/* Fade music */
function fadeMusic(target, duration) {
  const start = music.volume;
  let step = 0;
  const total = 30;
  const fade = setInterval(() => {
    step++;
    music.volume = start + (target - start) * (step / total);
    sessionStorage.setItem("musicVolume", music.volume);
    if (step >= total) clearInterval(fade);
  }, duration / total);
}
</script>

</body>
</html>
