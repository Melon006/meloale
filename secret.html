<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One More Thing 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0b0b12, #000);
  color: #ffcc66;
  font-family: 'Patrick Hand', cursive;
  overflow-x: hidden;
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Floating glow particles */
.particle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: rgba(255,200,150,0.7);
  border-radius: 50%;
  animation: floatUp 9s linear infinite;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 1; }
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 80px 30px;
}

h1 {
  text-align: center;
  font-size: 48px;
  margin-bottom: 50px;
}

#letter {
  font-size: 22px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 22px;
  background: #ffcc66;
  animation: blink 1s infinite;
  margin-left: 4px;
}

@keyframes blink {
  0%,50% { opacity: 1; }
  51%,100% { opacity: 0; }
}

.last-glow {
  animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 6px rgba(255,150,120,.4); }
  to   { text-shadow: 0 0 14px rgba(255,150,120,.9); }
}

.buttons {
  margin-top: 50px;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  transition: all .8s ease;
}

button {
  padding: 14px 34px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  margin: 12px;
  cursor: pointer;
  font-family: inherit;
  background: #ffb703;
  color: #2a1600;
}

.no {
  background: #444;
  color: #eee;
}

/* Hearts */
.heart {
  position: fixed;
  font-size: 22px;
  animation: heartFloat 3s linear forwards;
  pointer-events: none;
}

@keyframes heartFloat {
  from { transform: translateY(0); opacity: 1; }
  to   { transform: translateY(-160px); opacity: 0; }
}

@media (max-width: 600px) {
  h1 { font-size: 36px; }
  #letter { font-size: 20px; }
}
</style>
</head>

<body>

<!-- 🎶 Music -->
<audio id="bgMusic" src="assets/romantic.mp3" loop></audio>

<!-- ✨ Floating particles -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDelay = Math.random() * 8 + "s";
    document.body.appendChild(p);
  }
});
</script>

<div class="container">
  <h1>Hey Aleena…</h1>

  <div id="letter">
    <span class="cursor" id="cursor"></span>
  </div>

  <div class="buttons" id="buttons">
    <button onclick="yes()">Yes 💖</button>
    <button class="no" onclick="no()">No 🙈</button>
  </div>
</div>

<!-- ✅ JS MUST BE DEFERRED -->
<script src="js/proposal.js" defer></script>

</body>
</html>
